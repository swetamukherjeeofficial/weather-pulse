<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="Style.Css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="mainBox mainBox1">
        <img src="/Images/drizzle.png" class="drizzleImg">
        <h1 class="weather">Weather</h1>
        <h2 class="Forecasts">ForeCasts</h2>
        <button class="start">Get Start</button>
    </div>

    <div class="mainBox mainBox2 inactive">
        <div class="searchBox">
            <input type="text" placeholder="Enter your city" id="inputfield">
            <img src="/Images/search.png" id="searchIcon">
        </div>

        <div class="iconBox">
            <img src="/Images/clear.png" id="icon">
            <p id="desc">description</p>
        </div>

        <div class="tempBox">
            <h1 id="temp">0°c</h1>
            <h3 id="city">City Name</h3>
        </div>

        <div class="extraDetails">
            <div class="wind">
                <img src="/Images/wind.png" id="windIcon">
                <div class="windData">
                    <p id="windSpeed">0km/h</p>
                    <p>wind</p>
                </div>
            </div>

            <div class="humidity">
                <img src="/Images/humidity.png" id="humidityIcon">
                <div class="humidityData">
                    <p id="humidityper">0%</p>
                    <p>humidity</p>
                </div>
            </div>
        </div>
    </div>

    <div class="mainBox errorBox mainBox3 inactive">
        <h1>404</h1>
        <p class="notFound">Oops! Page Not Found</p>
        <p id="info">The page you're looking for doesn't exist or has been moved.</p>
        <button class="start homeBtn">Go Home</button>
    </div>

    <script src="App.Js"></script>
</body>
</html>
